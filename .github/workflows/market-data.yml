# Downloads Binance's public market-data archive (data.binance.vision) on a
# GitHub runner and publishes it to the `market-data` branch, for the strategy
# audit: the audit's sandbox cannot reach Binance directly. Read-only public
# data, no API keys. Lives on its own branch so it never touches the app code.
name: Market data snapshot (audit)

on:
  push:
    branches: [audit/market-data]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download Binance public archive
        run: python3 fetch_market_data.py out

      - name: Publish to the market-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp README.md out/README.md
          cd out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Binance market-data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market-data
